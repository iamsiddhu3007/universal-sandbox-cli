[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-sandbox-cli"
version = "0.1.2"
description = "Ephemeral polyglot sandbox pre-configured for AI agents."
requires-python = ">=3.8"
dependencies = [
    "docker",
    "click"
]

[project.scripts]
universal-sandbox-cli = "universal_sandbox.main:main"